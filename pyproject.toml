[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-memory-bridge"
version = "0.1.0"
description = "Incremental, traceable personal memory collection for Markdown, Codex and Hermes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp==4.0.10"]

[project.scripts]
personal-memory = "personal_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
